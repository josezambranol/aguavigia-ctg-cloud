services:
  - type: web
    name: aguavigia-ctg
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "10000"
      - key: SPRING_PROFILES_ACTIVE
        value: "docker"
      - key: INGESTA_MODO
        value: "auto"
      - key: VECINOS_SINTETICOS
        value: "0"
      - key: AGUAVIGIA_CONSENSO_REDES_MINIMAS
        value: "1"
      - key: RATE_LIMIT_FACTOR
        value: "1"
