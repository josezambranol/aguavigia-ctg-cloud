services:
  - type: web
    name: aguavigia-ctg
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "10000"
      - key: SPRING_PROFILES_ACTIVE
        value: "docker"
      - key: INGESTA_MODO
        value: "local"
      - key: VECINOS_SINTETICOS
        value: "25"
      - key: AGUAVIGIA_CONSENSO_REDES_MINIMAS
        value: "1"
      - key: RATE_LIMIT_FACTOR
        value: "100"
      - key: JAVA_MEM_OPTS
        value: "-Xms64m -Xmx220m -XX:MaxMetaspaceSize=88m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss256k -Daguavigia.mongo.max-pool=8 -Daguavigia.sql.copia-retraso-inicial-ms=25000 -Daguavigia.ingesta.retraso-inicial-ms=15000"
